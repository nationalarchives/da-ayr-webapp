services:
  opensearch_indexer_tests:
    build:
      context: ./data_management/opensearch_indexer
      dockerfile: Dockerfile
    user: root
    volumes:
      - .:/app
      - ./test_results:/test_results
    working_dir: /app
    entrypoint: ""
    environment:
      OPENSEARCH_INTEGRATION_URL: http://opensearch:9200
    command:
    - sh
    - -c
    - |
        set -e

        apt-get update

        echo 'Installing Python test dependencies...'
        pip install -r data_management/opensearch_indexer/requirements-dev.txt

        pytest \
          --cov=data_management/opensearch_indexer/opensearch_indexer \
          --cov-report=xml:/test_results/opensearch_indexer_coverage.xml \
          --cov-report=term-missing \
          -vvs data_management/opensearch_indexer/tests
    depends_on:
      postgres:
        condition: service_started
      opensearch:
        condition: service_healthy

  opensearch:
    image: opensearchproject/opensearch:3.9.0@sha256:adfa61f85025d06b4aeb562e7e74fde7e31c437039c93c3862c17e9acebd6c7c
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: "false"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9200"]
      interval: 10s
      timeout: 5s
      retries: 30

  access_copy_converter_tests:
    build:
      context: ./data_management/access_copy_converter
      dockerfile: Dockerfile
    user: root
    volumes:
      - .:/app
      - ./test_results:/test_results
    working_dir: /app
    entrypoint: ""
    environment:
      AWS_DEFAULT_REGION: eu-west-2
    command:
    - sh
    - -c
    - |
        set -e

        apt-get update

        echo 'Installing Python test dependencies...'
        pip install -r data_management/access_copy_converter/requirements-dev.txt

        pytest \
          --cov=data_management/access_copy_converter/access_copy_converter \
          --cov-report=xml:/test_results/access_copy_converter_coverage.xml \
          --cov-report=term-missing \
          -vvs data_management/access_copy_converter/tests
    depends_on:
      - postgres

  dri_to_ayr_data_migration_tests:
    build:
      context: ./data_management/dri_to_ayr_data_migration/tests
      dockerfile: Dockerfile
    user: root
    volumes:
      - .:/app
      - ./test_results:/test_results
    working_dir: /app
    entrypoint: ""
    environment:
      RUSTFS_ENDPOINT_URL: http://migration-rustfs:9000
    depends_on:
      migration-rustfs:
        condition: service_healthy
    command:
    - sh
    - -c
    - |
        set -e

        apt-get update

        echo 'Installing Python test dependencies...'
        pip install -r data_management/dri_to_ayr_data_migration/tests/requirements-dev.txt

        pytest \
          --confcutdir=data_management/dri_to_ayr_data_migration \
          --cov=data_management/dri_to_ayr_data_migration \
          --cov-report=xml:/test_results/dri_to_ayr_data_migration_coverage.xml \
          --cov-report=term-missing \
          -vvs data_management/dri_to_ayr_data_migration/tests

  migration-rustfs:
    image: rustfs/rustfs:1.0.0-rc.6@sha256:97171b3d72cd47dc81000f92ea84de25608bfc35a94c965501afaeb5d99f6035
    environment:
      RUSTFS_ACCESS_KEY: migration-test
      RUSTFS_SECRET_KEY: migration-test-secret # pragma: allowlist secret
      RUSTFS_CONSOLE_ENABLE: "false"
    tmpfs:
      - /data:uid=10001,gid=10001,mode=0700
    command: ["/data"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health/ready"]
      interval: 1s
      timeout: 2s
      retries: 30
      start_period: 2s

  postgres:
    image: postgres@sha256:3a82e1f56c8f0f5616a11103ac3d47e632c3938698946a7ad26da0df1334744a # postgres:18.0 with digest for immutability
    environment:
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testPass123 # pragma: allowlist secret
      POSTGRES_DB: testdb
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql

volumes:
  pgdata:

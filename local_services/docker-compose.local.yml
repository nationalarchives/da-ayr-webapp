# Local developer override — switches Keycloak back to HTTP/localhost so a
# Mac browser can resolve and reach the login page without TLS cert errors.
#
# Usage:
#   docker compose -f docker-compose.ci.yml -f docker-compose.local.yml up
#
# CI / e2e tests (no override):
#   docker compose -f docker-compose.ci.yml up

services:
  keycloak:
    environment:
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8080

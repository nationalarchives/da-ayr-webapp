name: Run CI tests

permissions:
  contents: read
  packages: read

on:
  pull_request:
  merge_group:

concurrency:
  group: ci-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      run_e2e: ${{ steps.filter.outputs.e2e }}
      run_accessibility: ${{ steps.filter.outputs.accessibility }}
      run_mds_smoke: ${{ steps.filter.outputs.mds_smoke }}

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false

    - name: Detect changed paths
      id: filter
      uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
      with:
        filters: |
          e2e:
            - 'app/**'
            - 'configs/**'
            - 'local_services/**'
            - 'e2e_tests/**'
            - 'docker-compose.yml'
            - 'Dockerfile'
            - 'main_app.py'
            - 'package*.json'
            - '.github/workflows/ci-tests.yml'
          accessibility:
            - 'app/**'
            - 'configs/**'
            - 'accessibility_tests/**'
            - 'local_services/**'
            - 'lighthouserc.js'
            - 'docker-compose.yml'
            - 'Dockerfile'
            - 'main_app.py'
            - 'package*.json'
            - '.github/workflows/ci-tests.yml'
          mds_smoke:
            - 'app/**'
            - 'configs/**'
            - 'local_services/mds_data_generator/**'
            - 'local_services/import/**'
            - 'docker-compose.yml'
            - 'Dockerfile'
            - 'main_app.py'
            - '.github/workflows/ci-tests.yml'

  build_webapp_image:
    needs: changes
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group' || needs.changes.outputs.run_e2e == 'true' || needs.changes.outputs.run_accessibility == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

    - name: Log in to GHCR for Docker cache
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build webapp image tar with cache
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        push: false
        tags: "da-ayr-beta-webapp:latest"
        cache-from: |
          type=gha,scope=webapp
          type=registry,ref=ghcr.io/nationalarchives/da-ayr-webapp-cache-webapp:main
        cache-to: type=gha,scope=webapp,mode=max
        outputs: type=docker,dest=/tmp/da-ayr-beta-webapp-image.tar

    - name: Upload webapp image artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: da-ayr-beta-webapp-image
        path: /tmp/da-ayr-beta-webapp-image.tar
        retention-days: 1

  e2e_tests:
    needs:
    - changes
    - build_webapp_image
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

    - name: Download webapp image artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: da-ayr-beta-webapp-image
        path: /tmp

    - name: Free up disk space
      run: |
        docker system prune -af --volumes
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf /usr/local/share/boost
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        sudo rm -rf /usr/local/share/powershell
        sudo rm -rf /usr/share/swift
        df -h

    - name: Load webapp image
      run: docker load --input /tmp/da-ayr-beta-webapp-image.tar

    - name: Verify webapp image is available locally
      run: docker image inspect da-ayr-beta-webapp:latest > /dev/null

    - name: Set up Docker Compose
      uses: docker/setup-compose-action@4eb059ff7f16592f9c84d5ca339c53cb7c5064e2 # v2.3.0
      with:
        version: v5.4.0

    - name: Generate Keycloak TLS certs
      run: ./local_services/generate-keycloak-certs.sh

    - name: Start Docker Compose with CI-specific configuration
      run: docker compose -f docker-compose.yml --env-file .docker.env up -d --wait --no-build webapp minio-init socat-localhost || exit $(docker compose -f docker-compose.yml --env-file .docker.env ps -q | xargs docker inspect -f '{{.State.ExitCode}}' | grep -v '^0' | wc -l)

    - name: Set up E2E test environment
      env:
        E2E_TEST_FILTER_VALUE: ${{ github.event_name == 'pull_request' && (needs.changes.outputs.run_e2e == 'true' && '.' || 'navigation_journeys') || '.' }}
      run: | # pragma: allowlist secret
        cat > .env.e2e_tests << EOF
        AYR_AAU_USER_USERNAME=testuser
        AYR_AAU_USER_PASSWORD=password123
        AYR_STANDARD_USER_USERNAME=testuser
        AYR_STANDARD_USER_PASSWORD=password123
        KEYCLOAK_BASE_URI=http://127.0.0.1:8080
        KEYCLOAK_CLIENT_ID=ayr-beta
        KEYCLOAK_REALM_NAME=tdr
        KEYCLOAK_CLIENT_SECRET=test-client-secret
        GIT_REF=main
        BROWSERS=chromium
        TEST_FILTER=$E2E_TEST_FILTER_VALUE
        EOF

    - name: Log in to GHCR for Docker cache
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build E2E Docker image with cache
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        context: e2e_tests
        push: false
        load: true
        tags: "e2e_tests:latest"
        cache-from: |
          type=gha,scope=e2e-tests
          type=registry,ref=ghcr.io/nationalarchives/da-ayr-webapp-cache-e2e-tests:main
        cache-to: type=gha,scope=e2e-tests,mode=max

    - name: Run E2E tests with Docker
      run: |
        docker run --rm --env-file .env.e2e_tests --network=host \
          -v "$(pwd)/e2e_tests":/e2e_tests e2e_tests:latest

    - name: Run MDS importer smoke test
      if: github.event_name == 'merge_group' || needs.changes.outputs.run_mds_smoke == 'true'
      run: |
        docker compose -f docker-compose.yml --env-file .docker.env \
          exec -T \
          -e PYTHONPATH=/docker_app:/docker_app/local_services/mds_data_generator \
          -e LANG=C.UTF-8 \
          webapp \
          python local_services/mds_data_generator/test_mds_import.py

    - name: Upload test results
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: always()
      with:
        name: playwright-report
        path: e2e_tests/playwright-report/
        retention-days: 7

    - name: Upload visual snapshots
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: always()
      with:
        name: visual-regression-snapshots
        path: e2e_tests/snapshots/
        retention-days: 7

    - name: Upload test results
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: always()
      with:
        name: e2e-test-results
        path: e2e_tests/test-results/
        retention-days: 7

    - name: Check logs after test failure
      if: failure()
      run: docker compose -f docker-compose.yml --env-file .docker.env logs

    - name: Stop services
      if: always()
      run: |
        docker compose -f docker-compose.yml --env-file .docker.env down -v
        docker system prune -f

  accessibility_tests:
    needs:
    - changes
    - build_webapp_image
    if: github.event_name == 'merge_group' || needs.changes.outputs.run_accessibility == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false

    - name: Download webapp image artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: da-ayr-beta-webapp-image
        path: /tmp

    - name: Load webapp image
      run: docker load --input /tmp/da-ayr-beta-webapp-image.tar

    - name: Verify webapp image is available locally
      run: docker image inspect da-ayr-beta-webapp:latest > /dev/null

    - name: Set up Docker Compose
      uses: docker/setup-compose-action@4eb059ff7f16592f9c84d5ca339c53cb7c5064e2 # v2.3.0
      with:
        version: v5.4.0

    - name: Generate Keycloak TLS certs
      run: ./local_services/generate-keycloak-certs.sh

    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24
        cache: npm

    - name: Clean node_modules before npm ci
      run: sudo rm -rf node_modules

    - name: Install dependencies
      run: npm ci

    - name: Start Docker Compose with CI-specific configuration
      run: docker compose -f docker-compose.yml --env-file .docker.env up -d --wait --no-build webapp minio-init socat-localhost || exit $(docker compose -f docker-compose.yml --env-file .docker.env ps -q | xargs docker inspect -f '{{.State.ExitCode}}' | grep -v '^0' | wc -l)

    - name: Wait for Keycloak token endpoint
      run: |
        for attempt in {1..30}; do
          if curl -fsS http://127.0.0.1:8080/realms/tdr/.well-known/openid-configuration -o /dev/null; then
            exit 0
          fi
          sleep 2
        done
        docker compose -f docker-compose.yml --env-file .docker.env logs keycloak
        exit 1

    - name: Set up Accessibility test environment
      env:
        KEYCLOAK_AUTH_URL_VALUE: ${{ vars.KEYCLOAK_AUTH_URL || 'http://127.0.0.1:8080/realms/tdr/protocol/openid-connect/token' }}
      run: | # pragma: allowlist secret
        cat > .env.accessibility << EOF
        AYR_AAU_USER_USERNAME=testuser
        AYR_AAU_USER_PASSWORD=password123
        KEYCLOAK_AUTH_URL=$KEYCLOAK_AUTH_URL_VALUE
        KEYCLOAK_CLIENT_ID=ayr-beta
        KEYCLOAK_CLIENT_SECRET=test-client-secret
        EOF

    - name: Run Accessibility CI
      env:
        LHCI_PR_SMOKE: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}
      run: |
        mkdir -p .accessibilityci
        set -a
        source .env.accessibility
        set +a
        npm run lighthouse:ci

    - name: Upload Accessibility artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: always()
      with:
        name: accessibility-report
        path: .accessibilityci/
        retention-days: 7

    - name: Check logs after test failure
      if: failure()
      run: docker compose -f docker-compose.yml --env-file .docker.env logs

    - name: Stop services
      if: always()
      run: |
        docker compose -f docker-compose.yml --env-file .docker.env down -v
        docker system prune -f

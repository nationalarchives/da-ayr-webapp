name: Run CI tests

permissions:
  contents: read
  packages: read

on:
  pull_request:
  merge_group:

jobs:
  e2e_tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false

    - name: Free up disk space
      run: |
        docker system prune -af --volumes
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf /usr/local/share/boost
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        sudo rm -rf /usr/local/share/powershell
        sudo rm -rf /usr/share/swift
        df -h

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

    - name: Log in to GHCR for Docker cache
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build webapp image with cache
      uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
      with:
        push: false
        load: true
        tags: "da-ayr-beta-webapp:latest"
        cache-from: |
          type=gha,scope=webapp
          type=registry,ref=ghcr.io/nationalarchives/da-ayr-webapp-cache-webapp:main
        cache-to: type=gha,scope=webapp,mode=max

    - name: Verify webapp image is available locally
      run: docker image inspect da-ayr-beta-webapp:latest > /dev/null

    - name: Set up Docker Compose
      uses: docker/setup-compose-action@8cccb8c14b6500aaffebff1aa49c502c34d2e5e6 # v2.1.0
      with:
        version: v2.40.3

    - name: Generate Keycloak TLS certs
      run: ./local_services/generate-keycloak-certs.sh

    - name: Start Docker Compose with CI-specific configuration
      run: cd local_services && docker compose -f docker-compose.ci.yml --env-file .docker.env up -d --wait --no-build webapp minio-init socat-localhost || exit $(docker compose ps -q | xargs docker inspect -f '{{.State.ExitCode}}' | grep -v '^0' | wc -l)

    - name: Set up E2E test environment
      run: | # pragma: allowlist secret
        cat > .env.e2e_tests << EOF
        AYR_AAU_USER_USERNAME=testuser
        AYR_AAU_USER_PASSWORD=password123
        AYR_STANDARD_USER_USERNAME=testuser
        AYR_STANDARD_USER_PASSWORD=password123
        KEYCLOAK_BASE_URI=http://127.0.0.1:8080
        KEYCLOAK_CLIENT_ID=ayr-beta
        KEYCLOAK_REALM_NAME=tdr
        KEYCLOAK_CLIENT_SECRET=test-client-secret
        BROWSERS=chromium
        TEST_FILTER=.
        EOF

    - name: Build E2E Docker image with cache
      uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
      with:
        context: e2e_tests
        push: false
        load: true
        tags: "e2e_tests:latest"
        cache-from: |
          type=gha,scope=e2e-tests
          type=registry,ref=ghcr.io/nationalarchives/da-ayr-webapp-cache-e2e-tests:main
        cache-to: type=gha,scope=e2e-tests,mode=max

    - name: Run E2E tests with Docker
      run: |
        docker run --rm --env-file .env.e2e_tests --network=host \
          -v "$(pwd)/e2e_tests":/e2e_tests e2e_tests:latest

    - name: Run MDS importer smoke test
      run: |
        docker compose -f local_services/docker-compose.ci.yml \
          exec -T \
          -e PYTHONPATH=/docker_app:/docker_app/local_services/mds_data_generator \
          -e LANG=C.UTF-8 \
          webapp \
          python local_services/mds_data_generator/test_mds_import.py

    - name: Upload Playwright report
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: always()
      with:
        name: playwright-report
        path: e2e_tests/playwright-report/
        retention-days: 7

    - name: Upload visual snapshots
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: always()
      with:
        name: visual-regression-snapshots
        path: e2e_tests/snapshots/
        retention-days: 7

    - name: Upload E2E test results
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: always()
      with:
        name: e2e-test-results
        path: e2e_tests/test-results/
        retention-days: 7

    - name: Check logs after test failure
      if: failure()
      run: cd local_services && docker compose -f docker-compose.ci.yml logs

    - name: Stop services
      if: always()
      run: |
        cd local_services
        docker compose -f docker-compose.ci.yml down -v
        docker system prune -f

  accessibility_tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

    - name: Log in to GHCR for Docker cache
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build webapp image with cache
      uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
      with:
        push: false
        load: true
        tags: "da-ayr-beta-webapp:latest"
        cache-from: |
          type=gha,scope=webapp
          type=registry,ref=ghcr.io/nationalarchives/da-ayr-webapp-cache-webapp:main
        cache-to: type=gha,scope=webapp,mode=max

    - name: Verify webapp image is available locally
      run: docker image inspect da-ayr-beta-webapp:latest > /dev/null

    - name: Set up Docker Compose
      uses: docker/setup-compose-action@8cccb8c14b6500aaffebff1aa49c502c34d2e5e6 # v2.1.0
      with:
        version: v2.40.3

    - name: Generate Keycloak TLS certs
      run: ./local_services/generate-keycloak-certs.sh

    - name: Start Docker Compose with CI-specific configuration
      run: cd local_services && docker compose -f docker-compose.ci.yml --env-file .docker.env up -d --wait --no-build webapp minio-init socat-localhost || exit $(docker compose ps -q | xargs docker inspect -f '{{.State.ExitCode}}' | grep -v '^0' | wc -l)

    - name: Set up Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: 20
        cache: npm

    - name: Install dependencies
      run: npm ci

    - name: Set up Accessibility test environment
      env:
        KEYCLOAK_AUTH_URL_VALUE: ${{ vars.KEYCLOAK_AUTH_URL || 'http://127.0.0.1:8080/realms/tdr/protocol/openid-connect/token' }}
      run: | # pragma: allowlist secret
        cat > .env.accessibility << EOF
        AYR_AAU_USER_USERNAME=testuser
        AYR_AAU_USER_PASSWORD=password123
        KEYCLOAK_AUTH_URL=$KEYCLOAK_AUTH_URL_VALUE
        KEYCLOAK_CLIENT_ID=ayr-beta
        KEYCLOAK_CLIENT_SECRET=test-client-secret
        EOF

    - name: Run Accessibility CI
      run: |
        mkdir -p .accessibilityci
        set -a
        source .env.accessibility
        set +a
        npm run lighthouse:ci

    - name: Upload Accessibility artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: always()
      with:
        name: accessibility-report
        path: .accessibilityci/
        retention-days: 7

    - name: Check logs after test failure
      if: failure()
      run: cd local_services && docker compose -f docker-compose.ci.yml logs

    - name: Stop services
      if: always()
      run: |
        cd local_services
        docker compose -f docker-compose.ci.yml down -v
        docker system prune -f

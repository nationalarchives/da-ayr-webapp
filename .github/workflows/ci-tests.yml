name: Run CI tests

permissions:
  contents: read

on:
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      users:
        description: "Number of concurrent users"
        required: false
        default: "20"
      spawn_rate:
        description: "Users spawned per second"
        required: false
        default: "2"
      run_time:
        description: "Locust run time (for example 3m, 5m, 1h)"
        required: false
        default: "3m"

jobs:
  build_webapp_image:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

    - name: Build webapp image tar with cache
      uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
      with:
        push: false
        tags: "da-ayr-beta-webapp:latest"
        cache-from: type=gha
        cache-to: type=gha,mode=max
        outputs: type=docker,dest=/tmp/da-ayr-beta-webapp-image.tar

    - name: Upload webapp image artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: da-ayr-beta-webapp-image
        path: /tmp/da-ayr-beta-webapp-image.tar
        retention-days: 1

  e2e_tests:
    needs: build_webapp_image
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

    - name: Download webapp image artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: da-ayr-beta-webapp-image
        path: /tmp

    - name: Free up disk space
      run: |
        docker system prune -af --volumes
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf /usr/local/share/boost
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        sudo rm -rf /usr/local/share/powershell
        sudo rm -rf /usr/share/swift
        df -h

    - name: Load webapp image
      run: docker load --input /tmp/da-ayr-beta-webapp-image.tar

    - name: Verify webapp image is available locally
      run: docker image inspect da-ayr-beta-webapp:latest > /dev/null

    - name: Set up Docker Compose
      uses: docker/setup-compose-action@8cccb8c14b6500aaffebff1aa49c502c34d2e5e6 # v2.1.0
      with:
        version: v2.40.3

    - name: Generate Keycloak TLS certs
      run: ./local_services/generate-keycloak-certs.sh

    - name: Start Docker Compose with CI-specific configuration
      run: cd local_services && docker compose -f docker-compose.ci.yml --env-file .docker.env up -d --wait --no-build || exit $(docker compose ps -q | xargs docker inspect -f '{{.State.ExitCode}}' | grep -v '^0' | wc -l)

    - name: Set up E2E test environment
      run: | # pragma: allowlist secret
        cat > .env.e2e_tests << EOF
        AYR_AAU_USER_USERNAME=testuser
        AYR_AAU_USER_PASSWORD=password123
        AYR_STANDARD_USER_USERNAME=testuser
        AYR_STANDARD_USER_PASSWORD=password123
        KEYCLOAK_BASE_URI=http://127.0.0.1:8080
        KEYCLOAK_CLIENT_ID=ayr-beta
        KEYCLOAK_REALM_NAME=tdr
        KEYCLOAK_CLIENT_SECRET=test-client-secret
        GIT_REF=main
        BROWSERS=chromium
        TEST_FILTER=.
        EOF

    - name: Build E2E Docker image with cache
      uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
      with:
        context: e2e_tests
        push: false
        load: true
        tags: "e2e_tests:latest"
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Run E2E tests with Docker
      run: |
        docker run --rm --env-file .env.e2e_tests --network=host \
          -v "$(pwd)/e2e_tests":/e2e_tests e2e_tests:latest

    - name: Run MDS importer smoke test
      run: |
        docker compose -f local_services/docker-compose.ci.yml \
          exec -T \
          -e PYTHONPATH=/docker_app:/docker_app/local_services/mds_data_generator \
          -e LANG=C.UTF-8 \
          webapp \
          python local_services/mds_data_generator/test_mds_import.py

    - name: Upload test results
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: always()
      with:
        name: playwright-report
        path: e2e_tests/playwright-report/
        retention-days: 7

    - name: Upload visual snapshots
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: always()
      with:
        name: visual-regression-snapshots
        path: e2e_tests/snapshots/
        retention-days: 7

    - name: Upload test results
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: always()
      with:
        name: e2e-test-results
        path: e2e_tests/test-results/
        retention-days: 7

    - name: Check logs after test failure
      if: failure()
      run: cd local_services && docker compose -f docker-compose.ci.yml logs

    - name: Stop services
      if: always()
      run: |
        cd local_services
        docker compose -f docker-compose.ci.yml down -v
        docker system prune -f

  accessibility_tests:
    needs: build_webapp_image
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false

    - name: Download webapp image artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: da-ayr-beta-webapp-image
        path: /tmp

    - name: Load webapp image
      run: docker load --input /tmp/da-ayr-beta-webapp-image.tar

    - name: Verify webapp image is available locally
      run: docker image inspect da-ayr-beta-webapp:latest > /dev/null

    - name: Set up Docker Compose
      uses: docker/setup-compose-action@8cccb8c14b6500aaffebff1aa49c502c34d2e5e6 # v2.1.0
      with:
        version: v2.40.3

    - name: Generate Keycloak TLS certs
      run: ./local_services/generate-keycloak-certs.sh

    - name: Start Docker Compose with CI-specific configuration
      run: cd local_services && docker compose -f docker-compose.ci.yml --env-file .docker.env up -d --wait --no-build || exit $(docker compose ps -q | xargs docker inspect -f '{{.State.ExitCode}}' | grep -v '^0' | wc -l)

    - name: Set up Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: 20
        cache: npm

    - name: Install dependencies
      run: npm ci

    - name: Set up Accessibility test environment
      env:
        KEYCLOAK_AUTH_URL_VALUE: ${{ vars.KEYCLOAK_AUTH_URL || 'http://127.0.0.1:8080/realms/tdr/protocol/openid-connect/token' }}
      run: | # pragma: allowlist secret
        cat > .env.accessibility << EOF
        AYR_AAU_USER_USERNAME=testuser
        AYR_AAU_USER_PASSWORD=password123
        KEYCLOAK_AUTH_URL=$KEYCLOAK_AUTH_URL_VALUE
        KEYCLOAK_CLIENT_ID=ayr-beta
        KEYCLOAK_CLIENT_SECRET=test-client-secret
        EOF

    - name: Run Accessibility CI
      run: |
        mkdir -p .accessibilityci
        set -a
        source .env.accessibility
        set +a
        npm run lighthouse:ci

    - name: Upload Accessibility artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: always()
      with:
        name: accessibility-report
        path: .accessibilityci/
        retention-days: 7

    - name: Check logs after test failure
      if: failure()
      run: cd local_services && docker compose -f docker-compose.ci.yml logs

    - name: Stop services
      if: always()
      run: |
        cd local_services
        docker compose -f docker-compose.ci.yml down -v
        docker system prune -f

  performance_tests:
    needs: build_webapp_image
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false

    - name: Download webapp image artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: da-ayr-beta-webapp-image
        path: /tmp

    - name: Load webapp image
      run: docker load --input /tmp/da-ayr-beta-webapp-image.tar

    - name: Verify webapp image is available locally
      run: docker image inspect da-ayr-beta-webapp:latest > /dev/null

    - name: Set up Docker Compose
      uses: docker/setup-compose-action@8cccb8c14b6500aaffebff1aa49c502c34d2e5e6 # v2.1.0
      with:
        version: v2.40.3

    - name: Generate Keycloak TLS certs
      run: ./local_services/generate-keycloak-certs.sh

    - name: Start Docker Compose with CI-specific configuration
      run: cd local_services && docker compose -f docker-compose.ci.yml --env-file .docker.env up -d --wait --no-build || exit $(docker compose ps -q | xargs docker inspect -f '{{.State.ExitCode}}' | grep -v '^0' | wc -l)

    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
      with:
        python-version: 3.11

    - name: Install Locust
      run: pip install locust

    - name: Set up performance test environment
      env:
        KEYCLOAK_AUTH_URL_VALUE: ${{ vars.KEYCLOAK_AUTH_URL || 'http://127.0.0.1:8080/realms/tdr/protocol/openid-connect/token' }}
      run: | # pragma: allowlist secret
        cat > .env.performance << EOF
        CERT_PATH=False
        AYR_AAU_USER_USERNAME=testuser
        AYR_AAU_USER_PASSWORD=password123
        KEYCLOAK_AUTH_URL=$KEYCLOAK_AUTH_URL_VALUE
        KEYCLOAK_CLIENT_ID=ayr-beta
        KEYCLOAK_CLIENT_SECRET=test-client-secret
        EOF

    - name: Run Locust headless
      env:
        USERS: ${{ github.event.inputs.users || '20' }}
        SPAWN_RATE: ${{ github.event.inputs.spawn_rate || '2' }}
        RUN_TIME: ${{ github.event.inputs.run_time || '3m' }}
      run: |
        mkdir -p performance_tests/results
        set -a
        source .env.performance
        set +a

        if ! [[ "$USERS" =~ ^[0-9]+$ ]]; then
          echo "Invalid users input: $USERS"
          exit 1
        fi

        if ! [[ "$SPAWN_RATE" =~ ^[0-9]+([.][0-9]+)?$ ]]; then
          echo "Invalid spawn_rate input: $SPAWN_RATE"
          exit 1
        fi

        if ! [[ "$RUN_TIME" =~ ^[0-9]+[smhd]$ ]]; then
          echo "Invalid run_time input: $RUN_TIME"
          exit 1
        fi

        locust \
          -f performance_tests/locustfile.py \
          --headless \
          --host=https://127.0.0.1:5000 \
          --users "$USERS" \
          --spawn-rate "$SPAWN_RATE" \
          --autostart \
          --run-time "$RUN_TIME" \
          --autoquit 10 \
          --exit-code-on-error 1 \
          --only-summary \
          --csv performance_tests/results/locust \
          --html performance_tests/results/locust.html

    - name: Upload performance test artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: always()
      with:
        name: locust-performance-results
        path: performance_tests/results/
        retention-days: 7

    - name: Check logs after test failure
      if: failure()
      run: cd local_services && docker compose -f docker-compose.ci.yml logs

    - name: Stop services
      if: always()
      run: |
        cd local_services
        docker compose -f docker-compose.ci.yml down -v
        docker system prune -f

name: Run CI tests

permissions:
  contents: read
  packages: read

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main

concurrency:
  group: ci-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      run_accessibility: ${{ steps.filter.outputs.accessibility }}
      run_mds_smoke: ${{ steps.filter.outputs.mds_smoke }}

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false

    - name: Detect changed paths
      id: filter
      uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
      with:
        filters: |
          accessibility:
            - 'app/**'
            - 'configs/**'
            - 'accessibility_tests/**'
            - 'local_services/**'
            - 'lighthouserc.js'
            - 'docker-compose.yml'
            - 'Dockerfile'
            - 'main_app.py'
            - 'package*.json'
            - '.github/workflows/ci-tests.yml'
          mds_smoke:
            - 'app/**'
            - 'configs/**'
            - 'local_services/mds_data_generator/**'
            - 'local_services/import/**'
            - 'docker-compose.yml'
            - 'Dockerfile'
            - 'main_app.py'
            - '.github/workflows/ci-tests.yml'

  build_webapp_image:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Build webapp image tar with cache
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        push: false
        tags: "da-ayr-beta-webapp:latest"
        cache-from: |
          type=gha,scope=webapp
        cache-to: type=gha,scope=webapp,mode=max
        outputs: type=docker,dest=/tmp/da-ayr-beta-webapp-image.tar

    - name: Upload webapp image artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: da-ayr-beta-webapp-image
        path: /tmp/da-ayr-beta-webapp-image.tar
        retention-days: 1

  build_and_scan_deployable_images:
    name: Build and scan ${{ matrix.name }} image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: opensearch-indexer
            context: data_management/opensearch_indexer
          - name: access-copy-converter
            context: data_management/access_copy_converter
          - name: droid
            context: data_management/dri_to_ayr_data_migration/droid
          - name: finaliser
            context: data_management/dri_to_ayr_data_migration/finaliser
          - name: worker
            context: data_management/dri_to_ayr_data_migration/worker
          - name: series-coordinator
            context: data_management/dri_to_ayr_data_migration/series_coordinator

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Install Wiz CLI
      run: |
          curl -Lo wizcli https://downloads.wiz.io/v1/wizcli/latest/wizcli-linux-amd64
          curl -Lo /tmp/wizcli-sha256 https://downloads.wiz.io/v1/wizcli/latest/wizcli-linux-amd64-sha256
          curl -Lo /tmp/wizcli-sha256.sig https://downloads.wiz.io/v1/wizcli/latest/wizcli-linux-amd64-sha256.sig
          chmod +x wizcli
          curl -Lo public_key.asc https://downloads.wiz.io/wizcli/public_key.asc
          gpg --import public_key.asc
          gpg --verify /tmp/wizcli-sha256.sig /tmp/wizcli-sha256
          echo "$(cat /tmp/wizcli-sha256) wizcli" | sha256sum --check

    - name: Scan deployable build context with Wiz
      if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
      env:
        WIZ_CLIENT_ID: ${{ secrets.WIZ_CLIENT_ID }}
        WIZ_CLIENT_SECRET: ${{ secrets.WIZ_CLIENT_SECRET }}
        WIZ_PROJECT: ${{ secrets.WIZ_PROJECT_ACCESSYOURRECORDS }}
        WIZ_SCAN_NAME: ayr-${{ matrix.name }}-${{ github.run_number }}
      run: |
        ./wizcli scan dir \
          --client-id "$WIZ_CLIENT_ID" \
          --client-secret "$WIZ_CLIENT_SECRET" \
          --name "$WIZ_SCAN_NAME" \
          --project "$WIZ_PROJECT" \
          "${{ matrix.context }}"

    - name: Build deployable image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: ${{ matrix.context }}
        push: false
        load: true
        tags: ayr-${{ matrix.name }}:ci
        cache-from: type=gha,scope=deployable-${{ matrix.name }}
        cache-to: type=gha,scope=deployable-${{ matrix.name }},mode=max

    - name: Scan image with Wiz
      if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
      env:
        WIZ_CLIENT_ID: ${{ secrets.WIZ_CLIENT_ID }}
        WIZ_CLIENT_SECRET: ${{ secrets.WIZ_CLIENT_SECRET }}
        WIZ_PROJECT: ${{ secrets.WIZ_PROJECT_ACCESSYOURRECORDS }}
      run: |
        ./wizcli scan container-image \
          --client-id "$WIZ_CLIENT_ID" \
          --client-secret "$WIZ_CLIENT_SECRET" \
          --project "$WIZ_PROJECT" \
          "ayr-${{ matrix.name }}:ci"

  e2e_tests:
    needs:
    - changes
    - build_webapp_image
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Download webapp image artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: da-ayr-beta-webapp-image
        path: /tmp

    - name: Free up disk space
      run: |
        available_kb=$(df -Pk / | awk 'NR == 2 { print $4 }')
        minimum_kb=$((12 * 1024 * 1024))
        if [ "$available_kb" -lt "$minimum_kb" ]; then
          echo "Only $((available_kb / 1024 / 1024)) GiB free; reclaiming runner disk space"
          docker system prune -af --volumes
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
            /usr/local/lib/android /opt/hostedtoolcache/CodeQL \
            /usr/local/share/powershell /usr/share/swift
        else
          echo "$((available_kb / 1024 / 1024)) GiB free; skipping runner cleanup"
        fi
        df -h

    - name: Load webapp image
      run: docker load --input /tmp/da-ayr-beta-webapp-image.tar

    - name: Verify webapp image is available locally
      run: docker image inspect da-ayr-beta-webapp:latest > /dev/null

    - name: Set up Docker Compose
      uses: docker/setup-compose-action@54042514f505b273907334ae2b9cdbb9a0213c1a # v2.4.0
      with:
        version: v5.5.1

    - name: Generate Keycloak TLS certs
      run: ./local_services/generate-keycloak-certs.sh

    - name: Start Docker Compose with CI-specific configuration
      run: docker compose -f docker-compose.yml --env-file .docker.env up -d --wait --no-build webapp rustfs-init socat-localhost || exit $(docker compose -f docker-compose.yml --env-file .docker.env ps -q | xargs docker inspect -f '{{.State.ExitCode}}' | grep -v '^0' | wc -l)

    - name: Set up E2E test environment
      run: | # pragma: allowlist secret
        cat > .env.e2e_tests << EOF
        AYR_AAU_USER_USERNAME=testuser
        AYR_AAU_USER_PASSWORD=password123
        AYR_STANDARD_USER_USERNAME=testuser
        AYR_STANDARD_USER_PASSWORD=password123
        KEYCLOAK_BASE_URI=http://127.0.0.1:8080
        KEYCLOAK_CLIENT_ID=ayr-beta
        KEYCLOAK_REALM_NAME=tdr
        KEYCLOAK_CLIENT_SECRET=test-client-secret
        GIT_REF=main
        BROWSERS=chromium
        TEST_FILTER=.
        EOF

    - name: Build E2E Docker image with GHA cache
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: e2e_tests
        push: false
        load: true
        tags: "e2e_tests:latest"
        cache-from: type=gha,scope=e2e-tests
        cache-to: type=gha,scope=e2e-tests,mode=min

    - name: Run E2E tests with Docker
      run: |
        docker run --rm --env-file .env.e2e_tests --network=host \
          -v "$(pwd)/e2e_tests":/e2e_tests e2e_tests:latest

    - name: Run MDS importer smoke test
      if: github.event_name == 'merge_group' || needs.changes.outputs.run_mds_smoke == 'true'
      run: |
        docker compose -f docker-compose.yml --env-file .docker.env \
          exec -T \
          -e PYTHONPATH=/docker_app:/docker_app/local_services/mds_data_generator \
          -e LANG=C.UTF-8 \
          webapp \
          python local_services/mds_data_generator/test_mds_import.py

    - name: Upload test results
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: always()
      with:
        name: playwright-report
        path: e2e_tests/playwright-report/
        retention-days: 7

    - name: Upload visual snapshots
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: always()
      with:
        name: visual-regression-snapshots
        path: e2e_tests/snapshots/
        retention-days: 7

    - name: Upload test results
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: always()
      with:
        name: e2e-test-results
        path: e2e_tests/test-results/
        retention-days: 7

    - name: Check logs after test failure
      if: failure()
      run: docker compose -f docker-compose.yml --env-file .docker.env logs

    - name: Stop services
      if: always()
      run: |
        docker compose -f docker-compose.yml --env-file .docker.env down -v
        docker system prune -f

  accessibility_tests:
    needs:
    - changes
    - build_webapp_image
    if: github.event_name == 'push' || github.event_name == 'merge_group' || needs.changes.outputs.run_accessibility == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false

    - name: Download webapp image artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: da-ayr-beta-webapp-image
        path: /tmp

    - name: Load webapp image
      run: docker load --input /tmp/da-ayr-beta-webapp-image.tar

    - name: Verify webapp image is available locally
      run: docker image inspect da-ayr-beta-webapp:latest > /dev/null

    - name: Set up Docker Compose
      uses: docker/setup-compose-action@54042514f505b273907334ae2b9cdbb9a0213c1a # v2.4.0
      with:
        version: v5.5.1

    - name: Generate Keycloak TLS certs
      run: ./local_services/generate-keycloak-certs.sh

    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24
        cache: npm

    - name: Clean node_modules before npm ci
      run: sudo rm -rf node_modules

    - name: Install dependencies
      run: npm ci

    - name: Start Docker Compose with CI-specific configuration
      run: docker compose -f docker-compose.yml --env-file .docker.env up -d --wait --no-build webapp rustfs-init socat-localhost || exit $(docker compose -f docker-compose.yml --env-file .docker.env ps -q | xargs docker inspect -f '{{.State.ExitCode}}' | grep -v '^0' | wc -l)

    - name: Wait for Keycloak token endpoint
      run: |
        for attempt in {1..30}; do
          if curl -fsS http://127.0.0.1:8080/realms/tdr/.well-known/openid-configuration -o /dev/null; then
            exit 0
          fi
          sleep 2
        done
        docker compose -f docker-compose.yml --env-file .docker.env logs keycloak
        exit 1

    - name: Set up Accessibility test environment
      env:
        KEYCLOAK_AUTH_URL_VALUE: ${{ vars.KEYCLOAK_AUTH_URL || 'http://127.0.0.1:8080/realms/tdr/protocol/openid-connect/token' }}
      run: | # pragma: allowlist secret
        cat > .env.accessibility << EOF
        AYR_AAU_USER_USERNAME=testuser
        AYR_AAU_USER_PASSWORD=password123
        KEYCLOAK_AUTH_URL=$KEYCLOAK_AUTH_URL_VALUE
        KEYCLOAK_CLIENT_ID=ayr-beta
        KEYCLOAK_CLIENT_SECRET=test-client-secret
        EOF

    - name: Run Accessibility CI
      env:
        LHCI_PR_SMOKE: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}
      run: |
        mkdir -p .accessibilityci
        set -a
        source .env.accessibility
        set +a
        npm run lighthouse:ci

    - name: Upload Accessibility artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: always()
      with:
        name: accessibility-report
        path: .accessibilityci/
        retention-days: 7

    - name: Check logs after test failure
      if: failure()
      run: docker compose -f docker-compose.yml --env-file .docker.env logs

    - name: Stop services
      if: always()
      run: |
        docker compose -f docker-compose.yml --env-file .docker.env down -v
        docker system prune -f

  slack-alerts:
    needs:
    - build_webapp_image
    - build_and_scan_deployable_images
    - e2e_tests
    - accessibility_tests
    if: ${{ always() && (github.event_name == 'merge_group' || (github.event_name == 'push' && github.ref_name == 'main')) && (needs.build_webapp_image.result == 'failure' || needs.build_and_scan_deployable_images.result == 'failure' || needs.e2e_tests.result == 'failure' || needs.accessibility_tests.result == 'failure') }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false

    - name: Send Slack notification
      uses: ./.github/actions/slack-failed-workflow-notification
      with:
        slack_webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
        workflow_name: ${{ github.workflow }}
        target_ref: ${{ github.ref_name }}
        actor: ${{ github.triggering_actor || github.actor }}
        run_url: ${{ format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
        repo_name: ${{ github.repository }}

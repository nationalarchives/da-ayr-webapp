name: Warm Docker Build Cache

permissions:
  contents: read
  packages: write

on:
  push:
    branches:
    - main
  workflow_dispatch:

jobs:
  warm_docker_cache:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Warm webapp Docker cache
      uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
      with:
        push: false
        cache-from: |
          type=gha,scope=webapp
          type=registry,ref=ghcr.io/nationalarchives/da-ayr-webapp-cache-webapp:main
        cache-to: |
          type=gha,scope=webapp,mode=max
          type=registry,ref=ghcr.io/nationalarchives/da-ayr-webapp-cache-webapp:main,mode=max

    - name: Warm e2e Docker cache
      uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
      with:
        context: e2e_tests
        push: false
        cache-from: |
          type=gha,scope=e2e-tests
          type=registry,ref=ghcr.io/nationalarchives/da-ayr-webapp-cache-e2e-tests:main
        cache-to: |
          type=gha,scope=e2e-tests,mode=max
          type=registry,ref=ghcr.io/nationalarchives/da-ayr-webapp-cache-e2e-tests:main,mode=max

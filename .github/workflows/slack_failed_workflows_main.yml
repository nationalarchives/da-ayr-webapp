name: Slack Alert On Main Or Release Tag Workflow Failures

permissions: {}

on:
  workflow_run:
    workflows:
      - Pre-commit check
      - CodeQL
      - Trigger Non Prod Deployment CD
      - Run Performance Tests
      - Run Unit Tests
      - Dependency Review
      - Run CI tests
    types:
      - completed

jobs:
  slack-alerts:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Determine if run should notify
        id: should-notify
        env:
          HEAD_REF: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail

          SHOULD_NOTIFY=false
          TARGET_REF="$HEAD_REF"

          # Include main branch, semver-style release tags (e.g. 1.42.0, v1.42.0), and release/* refs.
          if [[ "$HEAD_REF" == "main" ]]; then
            SHOULD_NOTIFY=true
          elif [[ "$HEAD_REF" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([-.].*)?$ ]]; then
            SHOULD_NOTIFY=true
          elif [[ "$HEAD_REF" == release/* ]]; then
            SHOULD_NOTIFY=true
          fi

          {
            echo "should_notify=$SHOULD_NOTIFY"
            echo "target_ref=$TARGET_REF"
          } >> "$GITHUB_OUTPUT"

      - name: Build Slack payload
        if: ${{ steps.should-notify.outputs.should_notify == 'true' }}
        id: build-payload
        env:
          CHANNEL: da-ayr-alerts
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          TARGET_REF: ${{ steps.should-notify.outputs.target_ref }}
          ACTOR: ${{ github.event.workflow_run.triggering_actor.login || github.event.workflow_run.actor.login }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          REPO_NAME: ${{ github.repository }}
        run: |
          PAYLOAD=$(jq -n \
            --arg channel "$CHANNEL" \
            --arg workflow "$WORKFLOW_NAME" \
            --arg target_ref "$TARGET_REF" \
            --arg actor "$ACTOR" \
            --arg url "$RUN_URL" \
            --arg repo "$REPO_NAME" \
            '{
              channel: ("#" + $channel),
              text: (
                "GitHub Actions failure on main/release tag\n" +
                ":x: Workflow *" + $workflow + "* failed in *" + $repo + "*\n" +
                "Ref: " + $target_ref + "\n" +
                "Triggered by: " + $actor + "\n" +
                "*<" + $url + "|Open workflow run>*"
              )
            }')
          {
            echo "payload<<PAYLOAD_EOF"
            echo "$PAYLOAD"
            echo "PAYLOAD_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Send Slack notification
        if: ${{ steps.should-notify.outputs.should_notify == 'true' }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          PAYLOAD: ${{ steps.build-payload.outputs.payload }}
        run: |
          set -euo pipefail

          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "SLACK_WEBHOOK_URL is not configured. Skipping Slack notification."
            exit 0
          fi

          HTTP_STATUS=$(curl -sS -L \
            -o /dev/null \
            -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            --data "$PAYLOAD" \
            "$SLACK_WEBHOOK_URL")

          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "Slack notification failed with HTTP status: $HTTP_STATUS"
            exit 1
          fi

          echo "Slack notification sent (HTTP $HTTP_STATUS)"

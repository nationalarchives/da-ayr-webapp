name: Pre-commit check

permissions:
  contents: read
on:
  pull_request:
  merge_group:

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        persist-credentials: false
    - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '20'
        cache: 'npm'

    - run: npm install

    - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd

  poetry-lock-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        persist-credentials: false
    - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
      with:
        python-version: 3.14
    - name: Install Poetry
      run: pip install poetry
    - name: Check root poetry.lock is in sync with pyproject.toml
      run: poetry check --lock
    - name: Check e2e_tests poetry.lock is in sync with pyproject.toml
      run: cd e2e_tests && poetry check --lock

  slack-alerts:
    needs:
    - pre-commit
    - poetry-lock-check
    if: ${{ always() && github.event_name == 'merge_group' && (needs.pre-commit.result == 'failure' || needs.poetry-lock-check.result == 'failure') }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
    - name: Checkout repository
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        persist-credentials: false

    - name: Send Slack notification
      uses: ./.github/actions/slack-failed-workflow-notification
      with:
        slack_webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
        workflow_name: ${{ github.workflow }}
        target_ref: ${{ github.ref_name }}
        actor: ${{ github.triggering_actor || github.actor }}
        run_url: ${{ format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
        repo_name: ${{ github.repository }}

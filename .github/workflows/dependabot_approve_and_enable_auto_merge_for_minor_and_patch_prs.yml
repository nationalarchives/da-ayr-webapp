name: Approve and enable auto-merge on Dependabot PRs for patch and minor updates

# ⚠️ SECURITY NOTICE ⚠️
# This workflow automatically approves and merges pull requests under STRICT conditions.
# 
# SECURITY BOUNDARIES - DO NOT MODIFY WITHOUT TEAM REVIEW:
# 1. ONLY for Dependabot-created PRs (github.event.pull_request.user.login == 'dependabot[bot]')
# 2. ONLY for this specific repository (github.repository == 'nationalarchives/da-ayr-beta-webapp')
# 3. ONLY for minor and patch version updates (NOT major versions)
# 4. All other PRs, including AI-generated code, require human review and approval
#
# WHY THESE RESTRICTIONS MATTER:
# - Dependabot PRs are automated dependency updates with known security scanning
# - Minor/patch updates are less likely to contain breaking changes
# - Major version updates require human review due to potential breaking changes
# - AI-generated code and human PRs always require human oversight
#
# If you need to modify this workflow, ensure you:
# 1. Discuss with the team and document the reason
# 2. Maintain or strengthen the security boundaries
# 3. Never remove the user.login or repository checks
# 4. Never extend auto-approval to non-Dependabot PRs

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'nationalarchives/da-ayr-beta-webapp'
    name: Approve and enable auto-merge on Dependabot PRs for minor and patch updates
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@21025c705c08248db411dc16f3619e6b5f9ea21a
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
      - name: Approve and enable auto-merge on Dependabot PRs for minor and patch updates
        if: (steps.metadata.outputs.update-type == 'version-update:semver-minor' || steps.metadata.outputs.update-type == 'version-update:semver-patch')
        run: gh pr review --approve "$PR_URL" && gh pr merge --auto --merge "$PR_URL"
        env:
            PR_URL: ${{ github.event.pull_request.html_url }}
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

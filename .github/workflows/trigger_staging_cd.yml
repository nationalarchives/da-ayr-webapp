name: Trigger Non Prod Deployment CD

permissions:
  contents: read

on:
    push:
      branches:
        - main

jobs:
  trigger:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [int, test-one]


    steps:
      - name: Trigger Application Deployment in da-ayr-terraform private repo
        run: |
          set -euo pipefail
          curl --fail-with-body -sS -L \
          -X POST \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer ${{ secrets.PAT }}" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          https://api.github.com/repos/nationalarchives/da-ayr-terraform/actions/workflows/deploy_application_code.yml/dispatches \
          -d '{"ref":"main","inputs":{"environment": "${{ matrix.environment }}"}}'

  slack-alerts:
    needs:
      - trigger
    if: ${{ always() && needs.trigger.result == 'failure' && (github.ref_name == 'main' || startsWith(github.ref_name, 'release/') || startsWith(github.ref, 'refs/tags/')) }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Send Slack notification
        uses: ./.github/actions/slack-failed-workflow-notification
        with:
          slack_webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
          workflow_name: ${{ github.workflow }}
          target_ref: ${{ github.ref_name }}
          actor: ${{ github.triggering_actor || github.actor }}
          run_url: ${{ format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
          repo_name: ${{ github.repository }}

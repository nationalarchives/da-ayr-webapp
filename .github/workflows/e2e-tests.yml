name: Run E2E Tests

permissions:
  contents: read

env:
  WEBAPP_IMAGE_CACHE_SCOPE: da-ayr-beta-webapp-ci-image

on:
  pull_request:
  merge_group:

jobs:
  e2e_tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v3.1.1

    - name: Free up disk space
      run: |
        docker system prune -af --volumes
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf /usr/local/share/boost
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        sudo rm -rf /usr/local/share/powershell
        sudo rm -rf /usr/share/swift
        df -h

    - name: Set up Docker Compose
      uses: docker/setup-compose-action@8cccb8c14b6500aaffebff1aa49c502c34d2e5e6 # v2.1.0
      with:
        version: v2.40.3

    - name: Pre-build webapp image with cache
      uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
      with:
        push: false
        load: true
        tags: "da-ayr-beta-webapp:latest"
        cache-from: type=gha,scope=${{ env.WEBAPP_IMAGE_CACHE_SCOPE }}
        cache-to: type=gha,scope=${{ env.WEBAPP_IMAGE_CACHE_SCOPE }},mode=max

    - name: Start Docker Compose with CI-specific configuration
      run: cd local_services && docker compose -f docker-compose.ci.yml --env-file .docker.env up -d --wait --no-build || exit $(docker compose ps -q | xargs docker inspect -f '{{.State.ExitCode}}' | grep -v '^0' | wc -l)

    - name: Set up E2E test environment
      run: | # pragma: allowlist secret
        cat > .env.e2e_tests << EOF
        AYR_AAU_USER_USERNAME=testuser
        AYR_AAU_USER_PASSWORD=password123
        AYR_STANDARD_USER_USERNAME=testuser
        AYR_STANDARD_USER_PASSWORD=password123
        KEYCLOAK_BASE_URI=http://127.0.0.1:8080
        KEYCLOAK_CLIENT_ID=ayr-beta
        KEYCLOAK_REALM_NAME=tdr
        KEYCLOAK_CLIENT_SECRET=test-client-secret
        GIT_REF=main
        BROWSERS=chromium
        TEST_FILTER=.
        EOF

    - name: Build E2E Docker image with cache
      uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
      with:
        context: e2e_tests
        push: false
        load: true
        tags: "e2e_tests:latest"
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Run E2E tests with Docker
      run: |
        docker run --rm --env-file .env.e2e_tests --network=host \
          -v "$(pwd)/e2e_tests":/e2e_tests e2e_tests:latest

    - name: Run MDS importer smoke test
      run: |
        docker compose -f local_services/docker-compose.ci.yml \
          exec -T \
          -e PYTHONPATH=/docker_app:/docker_app/local_services/mds_data_generator \
          -e LANG=C.UTF-8 \
          webapp \
          python local_services/mds_data_generator/test_mds_import.py

    - name: Upload test results
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: always()
      with:
        name: playwright-report
        path: e2e_tests/playwright-report/
        retention-days: 7

    - name: Upload visual snapshots
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: always()
      with:
        name: visual-regression-snapshots
        path: e2e_tests/snapshots/
        retention-days: 7

    - name: Upload test results
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: always()
      with:
        name: e2e-test-results
        path: e2e_tests/test-results/
        retention-days: 7
    - name: Check logs after test failure
      if: failure()
      run: cd local_services && docker compose -f docker-compose.ci.yml logs
    - name: Stop services
      if: always()
      run: |
        cd local_services
        docker compose -f docker-compose.ci.yml down -v
        docker system prune -f

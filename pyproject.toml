[tool.poetry]
name = "app"
version = "0.1.0"
description = ""
authors = ["Your Name <you@example.com>"]
readme = "README.md"

[tool.bandit]
exclude_dirs = ['*_test.py', '*/test_*.py', 'venv', 'node_modules']
skips = ["B105"]

[tool.poetry.dependencies]
python = ">=3.13,<3.14"
cssmin = "0.2.0"
flask-compress = "1.24"
flask-talisman = "1.1.0"
flask = "3.1.3"
govuk-frontend-jinja = "4.1.0"
govuk-frontend-wtf = "3.2.0"
gunicorn = "26.0.0"
jsmin = "3.0.1"
python-dotenv = "1.2.2"
redis = "8.1.0"
python-keycloak = "7.1.1"
boto3 = "^1"
flask-sqlalchemy = "^3.1.1"
psycopg2-binary = "^2.9.12"
setuptools = "^84.0.0"
flask-s3 = "^0.3.3"
pillow = "^12.2.0"
opensearch-py = "^3.2.0"
pymupdf = "^1.27.2"
requests-aws4auth = "^1.3.2"
bleach = "^6.3.0"
detect-secrets = "^1.5.0"
marshmallow = "^4.3.0"
six = "^1.17.0"
factory-boy = "^3.3.3"

[tool.poetry.group.dev.dependencies]
testing-postgresql = "1.3.0"
bandit = "1.9.4"
ruff = "0.16.2"
bs4 = "0.0.2"
moto = "5.2.2"
pip-tools = "7.6.0"
pyopenssl = "26.4.0"
pytest-cov = "7.1.0"
pytest-flask = "1.3.0"
pytest-playwright = "0.8.0"
pre-commit = "4.6.2"
safety = "3.8.1"
pyjwt = "2.13.0"
pytest-repeat = "0.9.4"
pytest-playwright-visual = "2.1.2"
poetry-plugin-export = "1.10.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 80

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "C90"]
ignore = ["E501", "B904", "B011", "B006", "B017", "B018", "B028"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
known-first-party = ["app"]
